<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Katch settings</title>
    <style>
      :root {
        --bg: #211f1c;
        --surface: #2a2724;
        --raised: #36322e;
        --line: #ffffff17;
        --t1: #ffffffe5;
        --t2: #ffffff91;
        --t3: #ffffff4f;
        --accent: #d9682b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 340px;
        max-width: 520px;
        padding: 16px;
        background: var(--bg);
        color: var(--t1);
        font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      h2 { font-size: 11px; font-weight: 400; color: var(--t3); margin: 0 0 8px; }
      .card { background: var(--surface); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      .hint { color: var(--t3); font-size: 11px; }
      .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .name { font-weight: 600; }
      button {
        border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-weight: 600; cursor: pointer;
        background: var(--raised); color: var(--t1);
      }
      .switch {
        position: relative; flex: none; width: 34px; height: 20px; padding: 0; border-radius: 999px;
        border: 1px solid var(--line); background: var(--raised); transition: background .15s;
      }
      .switch::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
        background: var(--t2); transition: transform .15s, background .15s;
      }
      .switch[aria-checked="true"] { background: var(--accent); }
      .switch[aria-checked="true"]::after { transform: translateX(14px); background: #1a1816; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
      li:first-child { border-top: 0; }
      li span { overflow-wrap: anywhere; }
      #empty { color: var(--t2); }
      @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
    </style>
  </head>
  <body>
    <h1>Katch</h1>

    <div class="card">
      <div class="switch-row">
        <div>
          <div class="name" id="pause-name">Pause Katch everywhere</div>
          <div class="hint" id="pause-hint">No Download buttons, nothing picked up from pages, downloads stay in the browser</div>
        </div>
        <button id="pause-switch" class="switch" role="switch" aria-checked="false" aria-labelledby="pause-name" aria-describedby="pause-hint"></button>
      </div>
    </div>

    <div class="card">
      <h2 id="sites-label">Sites Katch is off on (turn one off from the popup on that site)</h2>
      <p id="empty">None: Katch is on everywhere.</p>
      <ul id="sites" aria-labelledby="sites-label"></ul>
    </div>

    <script src="site-toggle.js"></script>
    <script src="options.js"></script>
  </body>
</html>
