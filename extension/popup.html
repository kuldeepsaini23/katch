<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #211f1c;
        --surface: #2a2724;
        --raised: #36322e;
        --line: #ffffff17;
        --t1: #ffffffe5;
        --t2: #ffffff91;
        --t3: #ffffff4f;
        --accent: #d9682b;
        --ok: #32d74b;
        --err: #ff453a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        padding: 14px;
        background: var(--bg);
        color: var(--t1);
        font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .logo { width: 28px; height: 28px; }
      .status { display: flex; align-items: center; gap: 6px; color: var(--t3); font-size: 12px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); }
      .dot.ok { background: var(--ok); }
      .dot.err { background: var(--err); }
      .card { background: var(--surface); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      label { display: block; color: var(--t3); font-size: 11px; margin-bottom: 6px; }
      .row { display: flex; gap: 8px; align-items: center; }
      input[type="text"] {
        flex: 1; min-width: 0; background: var(--bg); color: var(--t1);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit;
      }
      button {
        border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer;
        background: var(--raised); color: var(--t1);
      }
      button.primary { background: var(--accent); color: #1a1816; width: 100%; }
      .toggle { display: flex; justify-content: space-between; align-items: center; }
      .hint { color: var(--t3); font-size: 11px; }
      #message { min-height: 18px; font-size: 12px; color: var(--t2); margin-top: 8px; }
      .logo img { width: 28px; height: 28px; }
      #media { display: none; }
      #media.has { display: block; }
      .media-item { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
      .media-item:first-of-type { border-top: 0; }
      .media-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tag { font-size: 10px; font-weight: 600; color: #1a1816; background: var(--accent); border-radius: 4px; padding: 1px 5px; }
      .media-item button { padding: 5px 9px; font-size: 12px; }
      #quality { display: none; }
      #quality.has { display: block; }
      .q-title { font-weight: 600; font-size: 12.5px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .q-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--raised); margin-top: 4px; transition: filter .12s; }
      .q-row:hover { filter: brightness(1.2); }
      select { background: var(--bg); color: var(--t1); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; font: inherit; font-size: 12px; }
      .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--raised); border-radius: 6px; padding: 2px 4px 2px 7px; margin: 2px 4px 2px 0; color: var(--t2); }
      .chip button { background: none; padding: 0 3px; color: var(--t3); font-weight: 400; }
      .q-row .detail { margin-left: auto; color: var(--t2); font-weight: 400; font-size: 12px; }
      .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .switch-row + .switch-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
      .switch-row .name { font-weight: 600; overflow-wrap: anywhere; }
      .switch {
        position: relative; flex: none; width: 34px; height: 20px; padding: 0; border-radius: 999px;
        border: 1px solid var(--line); background: var(--raised); transition: background .15s;
      }
      .switch::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
        background: var(--t2); transition: transform .15s, background .15s;
      }
      .switch[aria-checked="true"] { background: var(--accent); }
      .switch[aria-checked="true"]::after { transform: translateX(14px); background: #1a1816; }
      .switch:disabled { opacity: .4; cursor: default; }
      .switch:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .off-note { display: none; margin-top: 8px; color: var(--t2); font-size: 12px; }
      body.off .off-note { display: block; }
      body.off #media { display: none; }
      .link { background: none; padding: 0; font-weight: 400; font-size: 11.5px; color: var(--t3); text-decoration: underline; }
      .link:hover { color: var(--t2); }
      @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><img src="icon-32.png" alt="" /></div>
      <div>
        <div style="font-weight: 600">Snag</div>
        <div class="status"><span id="dot" class="dot"></span><span id="status">Looking for the app…</span></div>
      </div>
    </header>

    <div class="card">
      <div class="switch-row">
        <div>
          <div class="name" id="site-name">Snag on this site</div>
          <div class="hint" id="site-hint">Download button, media list, catching downloads</div>
        </div>
        <button id="site-switch" class="switch" role="switch" aria-checked="true" aria-labelledby="site-name" aria-describedby="site-hint"></button>
      </div>
      <div class="switch-row">
        <div>
          <div class="name" id="pause-name">Pause Snag everywhere</div>
          <div class="hint" id="pause-hint">Same as turning it off on every site</div>
        </div>
        <button id="pause-switch" class="switch" role="switch" aria-checked="false" aria-labelledby="pause-name" aria-describedby="pause-hint"></button>
      </div>
      <div class="off-note" id="off-note" role="status"></div>
    </div>

    <button id="connect" class="primary" style="display: none; margin-bottom: 10px">Connect to Snag</button>
    <div class="card">
      <label for="token">Pairing code (Snag → Settings → Extension), or use Connect above</label>
      <div class="row">
        <input id="token" type="text" spellcheck="false" placeholder="32-character code" />
        <button id="save">Save</button>
      </div>
    </div>

    <div class="card toggle">
      <div>
        <div>Catch downloads</div>
        <div class="hint">Files over 1 MB go to Snag instead of Chrome</div>
      </div>
      <input id="catch" type="checkbox" />
    </div>

    <div class="card">
      <label>Download button on pages</label>
      <div class="toggle" style="margin-bottom: 8px">
        <div id="site-label">Show on this site</div>
        <input id="site-on" type="checkbox" />
      </div>
      <div class="toggle">
        <div>Position</div>
        <select id="corner">
          <option value="bottom-right">Bottom right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="top-right">Top right</option>
          <option value="top-left">Top left</option>
        </select>
      </div>
      <div id="hidden-list" class="hint" style="margin-top: 8px"></div>
    </div>

    <div id="media" class="card">
      <label>Media on this page</label>
      <div id="media-list"></div>
    </div>

    <div id="quality" class="card">
      <label>Download this video</label>
      <div class="q-title" id="q-title"></div>
      <div id="q-list"></div>
    </div>

    <button id="send" class="primary">Download this page…</button>
    <button id="grab" style="width: 100%; margin-top: 8px">Grab all from this page…</button>
    <button id="save-page" style="width: 100%; margin-top: 8px">Save this page as one file</button>
    <div id="message" role="status"></div>
    <button id="options" class="link">Sites Snag is off on…</button>

    <script src="quality.js"></script>
    <script src="pill.js"></script>
    <script src="site-toggle.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
