name: macOS

# Builds and tests Katch on macOS, and packages Katch.app (universal) as Katch-macOS.zip and
# Katch-macOS.dmg workflow artifacts (to try a branch on a Mac before it's released).
# Releases: release.yml.
on:
  push:
    branches: [master, feat/macos]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Apple silicon; the Intel half of the universal app is cross-compiled on it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (Intel)
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build Katch.app, the zip and the disk image
        run: bash packaging/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: katch-macos
          path: |
            target/macos/Katch-macOS.zip
            target/macos/Katch-macOS.dmg
            target/macos/SHA256SUMS-macos-*.txt
          if-no-files-found: error
